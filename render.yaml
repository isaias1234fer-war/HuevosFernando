services:
  - type: web
    name: huevos-fernando-api
    env: node
    buildCommand: cd server && npm install && npx prisma generate && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://huevos-fernando.vercel.app
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD
        sync: false
