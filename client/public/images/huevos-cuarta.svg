<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCuarta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="eggRustic1" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="eggRustic2" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>
    <linearGradient id="eggHighlightSubtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowCuarta" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradCuarta)" />
  <circle cx="400" cy="310" r="280" fill="url(#glowAmber)" />

  <!-- Diagonal warm culinary lines -->
  <g opacity="0.04" stroke="#f59e0b" stroke-width="1.5">
    <line x1="0" y1="100" x2="800" y2="500" />
    <line x1="0" y1="200" x2="800" y2="600" />
    <line x1="0" y1="0" x2="800" y2="400" />
  </g>

  <!-- Bakery / Basket Wire Stand -->
  <g filter="url(#shadowCuarta)">
    <ellipse cx="400" cy="435" rx="270" ry="65" fill="#09090b" opacity="0.6" />
    <path d="M 170 390 C 170 390, 400 450, 630 390 L 610 460 C 610 460, 400 500, 190 460 Z" fill="#292524" stroke="#78716c" stroke-width="2" />
    <ellipse cx="400" cy="390" rx="230" ry="45" fill="#1c1917" stroke="#44403c" stroke-width="2" />
    <!-- Wire grid of basket -->
    <path d="M 230 405 L 250 465 M 310 415 L 320 475 M 400 420 L 400 480 M 490 415 L 480 475 M 570 405 L 550 465" stroke="#78716c" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Whisk / Bakery Flour Accents in Background -->
  <g opacity="0.3" stroke="#fed7aa" stroke-width="2" fill="none">
    <path d="M 640 180 C 660 140, 710 180, 690 220 C 670 260, 630 250, 640 180" />
    <path d="M 650 160 C 670 120, 720 160, 700 200 C 680 240, 640 230, 650 160" />
    <line x1="680" y1="230" x2="740" y2="350" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Mixed Farm Eggs (Assorted sizes and shades for repostería & pastelería) -->
  <g filter="url(#shadowCuarta)">
    <!-- Back Left Egg -->
    <g transform="translate(280, 230) rotate(-18)">
      <ellipse cx="0" cy="65" rx="50" ry="70" fill="url(#eggRustic2)" />
      <path d="M -45 75 Q -25 -5 0 -22 Q 25 -5 45 75 Z" fill="url(#eggRustic2)" />
      <!-- Natural speckled marks -->
      <circle cx="-10" cy="30" r="2" fill="#78350f" opacity="0.6" />
      <circle cx="15" cy="45" r="2.5" fill="#78350f" opacity="0.5" />
      <ellipse cx="-12" cy="35" rx="16" ry="32" fill="url(#eggHighlightSubtle)" transform="rotate(-15 -12 35)" />
    </g>

    <!-- Back Right Egg (Slightly larger brown) -->
    <g transform="translate(520, 230) rotate(16)">
      <ellipse cx="0" cy="70" rx="54" ry="75" fill="url(#eggRustic1)" />
      <path d="M -48 80 Q -28 -8 0 -24 Q 28 -8 48 80 Z" fill="url(#eggRustic1)" />
      <circle cx="-5" cy="50" r="2.5" fill="#451a03" opacity="0.5" />
      <circle cx="12" cy="25" r="2" fill="#451a03" opacity="0.6" />
      <ellipse cx="-14" cy="38" rx="18" ry="34" fill="url(#eggHighlightSubtle)" transform="rotate(-15 -14 38)" />
    </g>

    <!-- Center Main Egg -->
    <g transform="translate(400, 190)">
      <ellipse cx="0" cy="100" rx="78" ry="105" fill="url(#eggRustic1)" />
      <path d="M -72 110 Q -40 -12 0 -38 Q 40 -12 72 110 Z" fill="url(#eggRustic1)" />
      <!-- Natural kitchen farm texture speckles -->
      <circle cx="-25" cy="70" r="3" fill="#451a03" opacity="0.6" />
      <circle cx="28" cy="95" r="3.5" fill="#451a03" opacity="0.5" />
      <circle cx="10" cy="40" r="2" fill="#451a03" opacity="0.7" />
      <ellipse cx="-24" cy="58" rx="28" ry="60" fill="url(#eggHighlightSubtle)" transform="rotate(-18 -24 58)" />
    </g>

    <!-- Front Left Egg -->
    <g transform="translate(250, 315) rotate(-24)">
      <ellipse cx="0" cy="55" rx="46" ry="62" fill="url(#eggRustic1)" />
      <path d="M -42 60 Q -22 -5 0 -18 Q 22 -5 42 60 Z" fill="url(#eggRustic1)" />
      <ellipse cx="-12" cy="30" rx="15" ry="30" fill="url(#eggHighlightSubtle)" transform="rotate(-15 -12 30)" />
    </g>

    <!-- Front Right Egg -->
    <g transform="translate(545, 315) rotate(22)">
      <ellipse cx="0" cy="55" rx="46" ry="62" fill="url(#eggRustic2)" />
      <path d="M -42 60 Q -22 -5 0 -18 Q 22 -5 42 60 Z" fill="url(#eggRustic2)" />
      <ellipse cx="-12" cy="30" rx="15" ry="30" fill="url(#eggHighlightSubtle)" transform="rotate(-15 -12 30)" />
    </g>
  </g>

  <!-- Value & Pastry Badge -->
  <g transform="translate(400, 520)" filter="url(#shadowCuarta)">
    <rect x="-200" y="-24" width="400" height="48" rx="24" fill="#78350f" stroke="#f59e0b" stroke-width="2" />
    <circle cx="-165" cy="0" r="14" fill="#f59e0b" />
    <text x="-165" y="5" fill="#451a03" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">★</text>
    <text x="15" y="6" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5" text-anchor="middle">
      4TA CALIDAD • REPOSTERÍA Y COCINA
    </text>
  </g>
</svg>
